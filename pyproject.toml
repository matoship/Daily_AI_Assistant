[project]
name = "daily-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kaifeng", email = "kaifeng.chen.ca@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.117.0",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
daily-assistant = "daily_assistant.run:main"
daily-assistant-sanity = "daily_assistant.eval.sanity:main"
[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
