identity:
  location: Adelaide, South Australia
  role: AI Engineer / ServiceNow Developer
  career_goal: AI Engineer / Forward Deployed Engineer
  focus: Applied AI and production software engineering

topics:
  immigration:
    watching:
      - SA state nomination 190/491 invitation rounds and criteria changes
      - ICT occupation list changes relevant to software and AI engineers
      - Department of Home Affairs skilled migration policy and processing changes
      - national migration changes that could affect my pathway to Australian PR

    irrelevant:
      - other states' nomination news unless it signals national policy shifts
      - family, partner, student, visitor, or humanitarian visa streams
      - generic migration news without practical impact on my pathway

  engineering:
    interests:
      - production LLM applications: agents, RAG, tool use, structured outputs, evals, observability
      - model and API releases from OpenAI, Anthropic, Google, and major open-weight providers
      - Python, Go, and TypeScript developments relevant to backend and AI engineering
      - backend architecture, APIs, databases, distributed systems, and async processing
      - Docker, Kubernetes, CI/CD, cloud infrastructure, and production AI deployment
      - practical AI engineering techniques that improve reliability, latency, cost, or maintainability

    irrelevant:
      - consumer gadget news
      - superficial AI product announcements
      - funding rounds without technical or hiring significance
      - AI hype or benchmark news with little practical engineering relevance
      - prompt-engineering tips aimed at general consumers
