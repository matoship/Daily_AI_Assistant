sources:
  - url: https://www.marktechpost.com/feed/
    name: MarkTechPost - AI & Technology News
    justification: Covers LLM application patterns, Claude API/model releases, and relevant backend/AI ecosystem news
  - url: https://www.infoq.com/feed/
    name: InfoQ - Software Development News
    justification: Provides updates on Python, Go, TypeScript ecosystem news relevant to backend and AI work
  - url: "https://hnrss.org/frontpage?points=150"
    name: Hacker News - front page (150+ points)
    justification: Community-filtered AI/engineering signal; the points threshold does quality control before triage ever sees it. Verified live before adding - 10 entries, real summaries, on-beat content.
  - url: https://www.innovationaus.com/feed/
    name: InnovationAus - Australian tech industry
    justification: ON TRIAL. Australian tech policy and industry coverage - the only AU-specific feed that survived pre-flight testing (real ~470-char summaries, not title-only). Hit rate unproven; review against triage_logs in two weeks and drop if it behaves like the retired migration feeds.

# Retired 2026-09-02 (TICKET-031): three Google News skilled-migration queries.
# They produced 239 of 425 corpus rows (~56% of triage volume) at an 8% human-approval
# rate, while a keyword search of the whole corpus found essentially zero articles about
# SA nomination rounds, ICT occupation lists, or any actual visa pathway change. The
# authoritative source (migration.sa.gov.au) has published nothing since July, so the
# planned scraper would not have helped either. Removed rather than rewritten - the
# signal is not in RSS.
#
# Feeds rejected during pre-flight testing, for the record: itnews.com.au and
# crn.com.au (both dead - zero entries), dev.to/career (spam), SmartCompany (off-beat),
# ITWire (499 entries of vendor press releases), ARN (IT-channel business news), and
# two Google News career queries (title-only summaries plus SEO listicles).
