# Sanity fixtures -- mechanical check that the eval harness plumbing works.
#
# NOT a golden set. These are real articles pulled from triage_logs on
# 2026-08-12, chosen because the model's OWN past output on them was already
# unambiguous (very high or very low relevance) -- not because a human
# independently labeled them. A fixture passing here only proves "triage is
# stable on easy cases", never "triage is correct". See golden_set.yaml for
# real ground-truth data built from actual human-reviewed disagreements.
#
# expected.min_relevance / max_relevance are thresholds, not exact-match
# targets: triage_article is not perfectly deterministic run to run, so
# asserting an exact score would make this flaky for reasons unrelated to
# whether triage is actually working.

